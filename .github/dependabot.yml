version: 2

# Dependency updates for the workspace, the detached fuzz crate, and the
# actions the workflows use. Updates arrive as grouped pull requests so a
# version bump does not flood the queue, and each one goes through the same CI
# gate as any other change.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
