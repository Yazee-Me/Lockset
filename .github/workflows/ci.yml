name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Reject the removed identity names
        # The bracketed characters keep this pattern from matching its own text;
        # the names it rejects must never return to the tree. `git grep` searches
        # tracked files, so it needs nothing beyond the checkout.
        run: |
          status=0
          git grep -n -i -E 'YAZEE[_]AGE_KEY|yazee-age[-]key|YZS[_]SOPS' -- . || status=$?
          case "$status" in
            0) echo 'legacy identity names are forbidden (LS-4)' >&2; exit 1 ;;
            1) exit 0 ;;
            *) echo 'git grep could not scan the tree' >&2; exit "$status" ;;
          esac
      - name: Test the workspace
        run: mise run test
