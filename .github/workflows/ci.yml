name: CI

# The pull-request gate: the workspace tests on Linux and Windows, lint/docs,
# supply-chain policy, end-to-end on Linux, MSRV, packaging, and the build
# without the keyring backend. The tool versions come from mise.toml, so CI and
# local development agree.
#
# Runner minutes are part of the design (LS-54). Blacksmith bills a 2 vCPU
# Linux minute at 1x, a 4 vCPU at 2x, Windows at 2x, and 6 vCPU macOS at 20x,
# and a job rounds up to one minute. A macOS job is therefore ~20 minutes of
# budget per run, so the macOS suite runs as one weekly job instead of two
# pull-request jobs; the cross-target builds run on main. Everything the gate
# promises (Linux tests, lint, advisories, end-to-end) still runs on every
# pull request.

on:
  push:
    branches: [main]
    # A documentation-only merge cannot change the binary.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - ".agents/**"
  pull_request:
  schedule:
    # Monday 04:43 UTC: the macOS test and end-to-end sweep.
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: blacksmith-2vcpu-ubuntu-2404
          - os: Windows
            runner: blacksmith-2vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Test the workspace
        run: cargo test --workspace --locked

  macos:
    name: Test and end-to-end (macOS)
    # One job rather than two: each job bills at least one minute at the 20x
    # macOS weight, so the second job doubles the weekly cost for no gate.
    # A manual dispatch runs it too, for a macOS check on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Run against the pinned sops and age
        run: mise run e2e

  lint:
    name: Lint, docs, and the tree guard
    # A push to main repeats checks the pull request already passed.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install the lint components
        # mise installs the rust toolchain without rustfmt/clippy; the local
        # toolchain has them, a fresh runner does not.
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Reject the removed identity names
        # The bracketed characters keep this pattern from matching its own text;
        # the names it rejects must never return to the tree. `git grep` searches
        # tracked files, so it needs nothing beyond the checkout.
        run: |
          status=0
          git grep -n -i -E 'YAZEE[_]AGE_KEY|yazee-age[-]key|YZS[_]SOPS' -- . || status=$?
          case "$status" in
            0) echo 'legacy identity names are forbidden (LS-4)' >&2; exit 1 ;;
            1) exit 0 ;;
            *) echo 'git grep could not scan the tree' >&2; exit "$status" ;;
          esac
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  supply-chain:
    name: Advisories, licenses, bans
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (Linux)
    # The pull request is the gate; a merge repeats nothing.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Run against the pinned sops and age
        run: mise run e2e

  packages:
    name: Package metadata
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh
      - name: The crates package with complete metadata
        run: cargo package --workspace --locked
      - name: cargo-binstall would fetch the published archives
        run: ./scripts/check-binstall.sh
      - name: Release notes carry the breaking change
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="lockset") | .version')
          body=$(dist plan --tag="v$version" --output-format=json | jq -r '.announcement_github_body // ""')
          # Read from a file: `grep -q` exits as soon as it matches, and a
          # larger body can then make printf fail on the closed pipe.
          printf '%s\n' "$body" > "$RUNNER_TEMP/release-body.md"
          grep -q 'Breaking changes' "$RUNNER_TEMP/release-body.md" \
            || { echo "release notes for v$version have no Breaking changes section" >&2; exit 1; }
          grep -q 'Identity and sops lookup' "$RUNNER_TEMP/release-body.md" \
            || { echo "release notes for v$version do not document the identity/sops rename" >&2; exit 1; }

  msrv:
    name: MSRV (1.89)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: The declared rust-version builds the workspace
        run: cargo check --workspace --all-targets --locked

  portability:
    name: Portability (no keyring)
    # The arm that explains a missing keyring backend is compiled and tested on
    # the pull request; the cross-target builds move to main (see cross-targets).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build without the keyring backend
        run: |
          cargo check --workspace --all-targets --no-default-features --locked
          cargo test -p lockset-tools --no-default-features --locked

  cross-targets:
    name: Supported targets
    # Cross-compiling the same code for three targets is the cheapest place to
    # catch a platform arm that only fails on a foreign target. It runs after
    # the merge instead of on every pull request.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build for Windows
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --workspace --lib --bins --target x86_64-pc-windows-gnu --locked
      - name: Build for Linux
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --workspace --lib --bins --target x86_64-unknown-linux-gnu --locked
      - name: Build for macOS
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --workspace --lib --bins --target aarch64-apple-darwin --locked
