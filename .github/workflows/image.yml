name: Container image

# ghcr.io/yazee-me/lockset: the CLI plus its pinned sops, as a non-root image.
# A pull request builds it and runs the container smoke test; a tag publishes
# per-platform images and merges them into one multi-arch tag, then records the
# digest on the release (that digest is what docs tell users to pin).
on:
  push:
    tags: ["v*"]
  pull_request:
    # The image definition and the dependency graph; a source change is already
    # compiled by the workspace tests, and the Dockerfile copies the whole
    # workspace. Building it on every code pull request cost ~98 free-equivalent
    # minutes a month (LS-54).
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/container-smoke.sh
      - .github/workflows/image.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/yazee-me/lockset

jobs:
  smoke:
    name: Build and smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Install age for the test identity
        run: sudo apt-get update && sudo apt-get install -y age
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        run: docker buildx build --platform linux/amd64 --load --tag lockset:ci .
      - name: "Smoke test: doctor, run, custody, non-root, no baked secrets"
        run: ./scripts/container-smoke.sh lockset:ci

  publish:
    name: Publish ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux/amd64
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the platform image
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="${VERSION#v}"
          docker buildx build \
            --platform "$PLATFORM" \
            --tag "$IMAGE:$version-$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --push .

  manifest:
    name: Publish the multi-arch tags and digest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platforms and record the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=("--tag" "$IMAGE:$version")
          case "$version" in
            *-*) ;;  # a prerelease gets only its own tag
            *)
              tags+=("--tag" "$IMAGE:${version%.*}" "--tag" "$IMAGE:latest")
              ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Container image"
            echo
            echo "Tags: \`$version\`, \`${version%.*}\`, \`latest\`"
            echo
            echo "Pinned: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$digest" > image-digest.txt
          # The cargo-dist release starts from the same tag and can create the
          # GitHub release after this job (v0.2.0 lost that race by a minute).
          # The platform images are already pushed, so wait for the release and
          # never fail the job afterwards: a rerun of this job attaches the
          # digest to the existing release without rebuilding images.
          uploaded=0
          for _ in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$GITHUB_REF_NAME" image-digest.txt --clobber; then
                uploaded=1
              fi
              break
            fi
            sleep 10
          done
          if [ "$uploaded" -ne 1 ]; then
            echo "::warning::image-digest.txt is not attached to the $GITHUB_REF_NAME release yet; the platform images are already pushed, so rerun this manifest job to attach the digest"
          fi
