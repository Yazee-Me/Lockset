[workspace]
resolver = "2"
members = ["lockset-core", "lockset-tools", "lockset"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The toolchain CI proves the workspace builds with (see the msrv job).
# 1.89 is required by the locked graph: aes 0.9.3 (secret-service) and
# uuid 1.29.0 (zbus) declare 1.89 as their own minimum.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yazee-Me/Lockset"
homepage = "https://github.com/Yazee-Me/Lockset"
keywords = ["secrets", "sops", "age", "environment", "ci"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
age = "0.12"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
keyring = { version = "4", features = ["v1"] }

[profile.dist]
inherits = "release"

# `cargo release patch --execute` bumps every crate (they share a version),
# opens the CHANGELOG's next version section from "Unreleased", commits, and
# tags v<version>; the tag then drives the cargo-dist release.
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
