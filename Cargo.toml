[workspace]
resolver = "2"
members = ["lockset-core", "lockset-tools", "lockset"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
age = "0.12"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
keyring = { version = "4", features = ["v1"] }
