[workspace]
members = ["cargo:."]

# cargo-dist: the release pipeline. `dist generate` writes the GitHub workflow;
# `dist plan` shows what a tag would produce. Targets follow the support matrix
# in LS-30. The shell and powershell installers are self-contained; the Homebrew
# formula is attached to every release as `lockset.rb`. Publishing the formula
# needs a `Yazee-Me/homebrew-tap` repository, so `tap` is not set here — a user
# installs the attached formula with `brew install ./lockset.rb` (see README).
[dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
]
checksum = "sha256"
# GitHub attestations are the SLSA provenance for every uploaded artifact.
github-attestations = true
# A tag run is the release; PRs keep running the ordinary CI only.
pr-run-mode = "skip"

# Every release job runs on Blacksmith except the Intel macOS build: Blacksmith
# macOS runners are ARM only, so x86_64-apple-darwin stays on GitHub's
# macos-15-intel image.
[dist.github-custom-runners]
global = "blacksmith-2vcpu-ubuntu-2404"
x86_64-unknown-linux-gnu = "blacksmith-4vcpu-ubuntu-2404"
x86_64-unknown-linux-musl = "blacksmith-4vcpu-ubuntu-2404"
aarch64-unknown-linux-gnu = "blacksmith-4vcpu-ubuntu-2404-arm"
aarch64-unknown-linux-musl = "blacksmith-4vcpu-ubuntu-2404-arm"
aarch64-apple-darwin = "blacksmith-6vcpu-macos-26"
x86_64-pc-windows-msvc = "blacksmith-2vcpu-windows-2025"
