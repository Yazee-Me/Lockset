[package]
name = "lockset-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/lockset-tools"
readme = "README.md"
description = "Tool and OS bindings for Lockset: filesystem, sops, keychain"

[features]
default = ["keyring"]
# The OS credential store. Off, `--custody keyring` fails with a clear message
# instead of pulling the platform backend in; macOS uses `security(1)` regardless.
keyring = ["dep:keyring"]

[dependencies]
lockset-core = { path = "../lockset-core", version = "0.1.0" }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { workspace = true, optional = true }
