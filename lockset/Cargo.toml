[package]
name = "lockset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/lockset"
readme = "README.md"
description = "Repository secrets with a small, boring surface"
# The neighbouring dist config belongs to the repository, not the crate.
exclude = ["dist.toml"]

[[bin]]
name = "lockset"
path = "src/main.rs"

[features]
default = ["keyring"]
# Forward the OS credential store; without it the binary still builds and
# `--custody keyring` explains that the backend is not compiled in.
keyring = ["lockset-tools/keyring"]

[dependencies]
lockset-core = { path = "../lockset-core", version = "0.1.0" }
lockset-tools = { path = "../lockset-tools", version = "0.1.0" }
anyhow.workspace = true
clap.workspace = true
rpassword.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
clap.workspace = true

# `cargo binstall lockset` fetches the cargo-dist archives from the release for
# the current target; the Windows archive is a zip, everything else tar.xz.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/lockset-{ target }.{ archive-format }"
bin-dir = "lockset-{ target }/lockset{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Release replacements run per package, so the workspace changelog is opened
# from this package only: one "## <version> - <date>" section per release.
[package.metadata.release]
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}", exactly = 1 },
]
