[package]
name = "lockset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Repository secrets with a small, boring surface"

[[bin]]
name = "lockset"
path = "src/main.rs"

[features]
default = ["keyring"]
# Forward the OS credential store; without it the binary still builds and
# `--custody keyring` explains that the backend is not compiled in.
keyring = ["lockset-tools/keyring"]

[dependencies]
lockset-core = { path = "../lockset-core" }
lockset-tools = { path = "../lockset-tools" }
anyhow.workspace = true
clap.workspace = true
rpassword.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
clap.workspace = true
